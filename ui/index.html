<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual DM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           oklch(11% 0.010 55);
  --surface:      oklch(15% 0.012 55);
  --surface-2:    oklch(19% 0.013 55);
  --surface-3:    oklch(24% 0.014 55);
  --copper:       oklch(62% 0.130 52);
  --copper-light: oklch(72% 0.110 52);
  --copper-dim:   oklch(42% 0.090 52);
  --copper-glow:  oklch(62% 0.130 52 / 0.12);
  --text:         oklch(91% 0.008 55);
  --text-2:       oklch(68% 0.008 55);
  --text-3:       oklch(48% 0.008 55);
  --text-dm:      oklch(90% 0.011 58);
  --border:       oklch(22% 0.011 55);
  --border-sub:   oklch(17% 0.009 55);
  --hp-full:      oklch(64% 0.140 155);
  --hp-mid:       oklch(68% 0.130 90);
  --hp-low:       oklch(64% 0.130 42);
  --hp-crit:      oklch(56% 0.130 22);
  --hp-zero:      oklch(38% 0.080 22);
  --font-n: 'EB Garamond', Garamond, Georgia, serif;
  --font-u: 'DM Sans', system-ui, -apple-system, sans-serif;
  --r: 4px;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-u); font-size: 15px; }

/* ── pre-session ─────────────────────────────────────── */
#pre-session {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center;
  padding: 48px 24px; overflow-y: auto;
}
#pre-session.hidden { display: none; }

.pre-eyebrow {
  font-size: 0.7rem; font-weight: 500; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--copper); margin-bottom: 20px;
}
.pre-campaign-name {
  font-family: var(--font-n); font-size: clamp(2.2rem, 5vw, 3.4rem);
  font-weight: 500; color: var(--text); text-align: center;
  line-height: 1.15; margin-bottom: 32px;
}
.pre-scene {
  font-family: var(--font-n); font-size: 1.05rem; font-style: italic;
  color: var(--text-2); max-width: 56ch; text-align: center;
  line-height: 1.7; margin-bottom: 40px;
}
.pre-party-row { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; }
.pre-pc {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 20px; min-width: 140px;
}
.pre-pc-name { font-size: 0.85rem; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.pre-pc-meta { font-size: 0.72rem; color: var(--text-3); margin-bottom: 10px; }
.pre-pc-track { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
.pre-pc-fill { height: 100%; border-radius: 2px; background: var(--hp-full); }
.pre-pc-nums { font-size: 0.7rem; color: var(--text-3); }

.campaign-btn {
  font-size: 0.78rem; font-weight: 500; padding: 8px 18px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.campaign-btn:hover { border-color: var(--copper-dim); color: var(--text); }
.campaign-btn.selected { border-color: var(--copper); color: var(--copper); background: var(--copper-glow); }

.btn-begin {
  font-size: 0.8rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--copper); color: var(--copper);
  padding: 13px 36px; border-radius: var(--r); cursor: pointer; transition: background 0.18s, color 0.18s;
}
.btn-begin:hover { background: var(--copper); color: var(--bg); }
.btn-begin:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── main layout ─────────────────────────────────────── */
#game {
  display: grid;
  grid-template-columns: 1fr 1fr 272px;
  grid-template-rows: 44px 1fr auto;
  height: 100vh; overflow: hidden;
}
#game.hidden { display: none; }

#campaign-bar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
  padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  font-size: 0.72rem;
}
.cb-name { font-family: var(--font-n); font-size: 0.9rem; font-weight: 500; color: var(--text); flex: 1; }
.cb-scene { color: var(--text-3); max-width: 40ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-session { display: flex; align-items: center; gap: 6px; color: var(--copper); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.68rem; }
.cb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--copper); animation: pulse-dot 2.4s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }

#narrative {
  grid-column: 1; grid-row: 2; overflow-y: auto; padding: 36px 36px 24px; scroll-behavior: smooth; max-width: 100%;
}
#narrative::-webkit-scrollbar { width: 4px; }
#narrative::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 2px; }

.dm-block {
  font-family: var(--font-n); font-size: 1.1rem; color: var(--text-dm);
  line-height: 1.82; max-width: 80ch; margin-bottom: 24px;
}
.dm-block p { margin-bottom: 0.8em; }
.dm-block p:last-child { margin-bottom: 0; }
.dm-block strong { font-weight: 600; color: var(--text); }
.dm-block em { font-style: italic; }
.dm-block h1,.dm-block h2,.dm-block h3 { font-size: 1rem; font-weight: 600; color: var(--text); margin: 1.2em 0 0.5em; }
.dm-block ul,.dm-block ol { padding-left: 1.4em; margin-bottom: 0.8em; }
.dm-block li { margin-bottom: 0.2em; }
.dm-block.streaming::after { content:'▋'; color:var(--copper); animation:blink .9s step-end infinite; margin-left:1px; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.player-block { display: flex; gap: 10px; align-items: baseline; margin-bottom: 16px; max-width: 80ch; }
.player-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--copper-dim); white-space: nowrap; min-width: 42px; }
.player-text { font-family: var(--font-n); font-size: 1rem; color: var(--text-2); line-height: 1.65; }

.tool-event { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-3); margin-bottom: 10px; max-width: 80ch; }
.te-icon { color: var(--copper-dim); }
.te-roll { font-weight: 600; color: var(--text-2); }
.te-hp-down { font-weight: 500; color: var(--hp-crit); }
.te-hp-up { font-weight: 500; color: var(--hp-full); }

.thinking { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-3); margin-bottom: 16px; }
.thinking-dots span { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--copper-dim); margin-right: 3px; animation: t-bounce 1.2s ease-in-out infinite; }
.thinking-dots span:nth-child(2) { animation-delay: .2s; }
.thinking-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes t-bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-4px)} }

/* ── scene art panel ─────────────────────────────────── */
#scene-panel {
  grid-column: 2; grid-row: 2 / 4;
  background: var(--surface); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}

/* scene image — top half */
#scene-art-wrap {
  flex: 1; position: relative; overflow: hidden;
  background: oklch(13% 0.01 55);
  display: flex; align-items: center; justify-content: center;
}
#scene-art-img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  transition: opacity 0.6s;
}
#scene-art-loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px;
}
.art-spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border);
  border-top-color: var(--copper-dim);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.art-spinner-label { font-size: 0.68rem; color: var(--text-3); letter-spacing: 0.06em; }
#scene-art-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px;
}
.art-empty-icon { font-size: 2rem; opacity: 0.2; }
.art-empty-label { font-size: 0.68rem; color: var(--text-3); text-align: center; max-width: 20ch; }

/* map section — bottom half */
#map-section {
  flex: 1; display: flex; flex-direction: column;
  border-top: 1px solid var(--border);
  overflow: hidden;
}
#map-art-wrap {
  flex: 1; position: relative; overflow: hidden;
  background: oklch(12% 0.008 55);
  display: flex; align-items: center; justify-content: center;
}
#map-img {
  width: 100%; height: 100%;
  object-fit: contain; object-position: center;
  transition: opacity 0.5s;
}
#map-loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
}
#map-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px;
  opacity: 0.5;
}
#map-controls {
  flex-shrink: 0; padding: 8px 10px; display: flex; gap: 6px;
  border-top: 1px solid var(--border-sub);
  background: var(--surface);
}
#map-prompt-input {
  flex: 1; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text); font-family: var(--font-u);
  font-size: 0.78rem; padding: 6px 10px; outline: none;
  transition: border-color .15s;
}
#map-prompt-input::placeholder { color: var(--text-3); }
#map-prompt-input:focus { border-color: oklch(62% .13 52 / .4); }
#map-gen-btn {
  font-size: 0.72rem; font-weight: 500; letter-spacing: 0.06em;
  padding: 6px 12px; border-radius: var(--r); cursor: pointer;
  background: transparent; border: 1px solid var(--copper-dim);
  color: var(--copper-dim); transition: all .15s; white-space: nowrap;
}
#map-gen-btn:hover:not(:disabled) { background: var(--copper-glow); border-color: var(--copper); color: var(--copper); }
#map-gen-btn:disabled { opacity: .35; cursor: not-allowed; }

#scene-info-bar {
  padding: 8px 14px; border-top: 1px solid var(--border-sub);
  background: var(--surface); flex-shrink: 0;
}
.scene-loc { font-size: 0.78rem; font-weight: 500; color: var(--text-2); margin-bottom: 2px; }
.scene-date { font-size: 0.65rem; color: var(--text-3); }

/* ── sidebar ─────────────────────────────────────────── */
#party-status {
  grid-column: 3; grid-row: 2 / 4; background: var(--surface); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 0;
}
#party-status::-webkit-scrollbar { width: 3px; }
#party-status::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 2px; }

.s-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; margin-top: 4px; }
.s-div { height: 1px; background: var(--border-sub); margin: 12px 0; }

/* PC cards */
.pc-card { margin-bottom: 20px; }
.pc-identity { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.pc-name-el { font-size: 0.85rem; font-weight: 500; color: var(--text); }
.pc-class-el { font-size: 0.68rem; color: var(--text-3); }
.hp-outer { position: relative; margin-bottom: 3px; }
.hp-track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.hp-fill { height: 100%; border-radius: 3px; transition: width .5s cubic-bezier(.25,.46,.45,.94), background .5s; }
.hp-nums { font-size: 0.68rem; color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; margin-bottom: 5px; }
.cond-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
.cond-pill { font-size: 0.62rem; font-weight: 500; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 2px; background: oklch(45% .12 42 / .18); color: oklch(72% .10 42); border: 1px solid oklch(45% .12 42 / .3); }
.cond-conc { background: oklch(45% .13 52 / .15); color: var(--copper); border-color: oklch(45% .13 52 / .3); font-style: italic; }
.ds-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.ds-lbl { font-size: 0.62rem; color: var(--text-3); }
.ds-pips { display: flex; gap: 3px; }
.ds-pip { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--border); background: transparent; }
.ds-pip.s { background: var(--hp-full); border-color: var(--hp-full); }
.ds-pip.f { background: var(--hp-crit); border-color: var(--hp-crit); }
.slots-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.slot-g { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.slot-lvl { font-size: 0.56rem; color: var(--text-3); }
.slot-pips { display: flex; gap: 2px; }
.slot-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--copper); opacity: .9; }
.slot-pip.used { background: var(--surface-3); opacity: .5; }

/* encounter */
.enc-round { font-size: 0.68rem; color: var(--text-3); margin-bottom: 8px; }
.c-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: var(--r); margin-bottom: 2px; font-size: 0.78rem; }
.c-row.active { background: var(--copper-glow); color: var(--text); outline: 1px solid oklch(62% .13 52 / .3); }
.c-row.dead { opacity: .35; }
.c-row.fled { opacity: .35; font-style: italic; }
.c-init { font-size: 0.68rem; font-variant-numeric: tabular-nums; color: var(--text-3); min-width: 20px; text-align: right; }
.c-name { flex: 1; }
.c-hp { font-size: 0.68rem; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* quests / clocks */
.q-item { margin-bottom: 8px; }
.q-title-el { font-size: 0.78rem; font-weight: 500; color: var(--text-2); margin-bottom: 2px; }
.q-status { display: inline-block; font-size: 0.6rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 5px; border-radius: 2px; background: var(--surface-2); color: var(--text-3); }
.q-status.active { background: oklch(62% .13 52 / .15); color: var(--copper); }
.cl-item { margin-bottom: 10px; }
.cl-name-el { font-size: 0.75rem; color: var(--text-2); margin-bottom: 4px; }
.cl-track { display: flex; gap: 3px; }
.cl-seg { flex: 1; height: 6px; border-radius: 1px; background: var(--surface-2); transition: background .4s; }
.cl-seg.filled { background: var(--copper); }

/* location / npc / inventory sidebar sections */
.loc-name { font-size: 0.82rem; font-weight: 500; color: var(--text-2); margin-bottom: 3px; }
.loc-date { font-size: 0.65rem; color: var(--text-3); margin-bottom: 8px; }
.npc-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 5px; }
.npc-disp { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
.npc-name-s { font-size: 0.78rem; color: var(--text-2); font-weight: 500; }
.npc-role-s { font-size: 0.65rem; color: var(--text-3); }
.inv-item { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-2); margin-bottom: 3px; }
.inv-qty { color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── player strip ────────────────────────────────────── */
#player-strip {
  grid-column: 1 / 3; grid-row: 3; display: grid; grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--border); background: var(--surface);
}
.pia { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.pia:first-child { border-right: 1px solid var(--border-sub); }
.pia-tag { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--copper-dim); }
.inp-row { display: flex; align-items: flex-end; gap: 6px; }
.player-ta {
  flex: 1; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text); font-family: var(--font-u);
  font-size: 0.85rem; padding: 8px 12px; resize: none; min-height: 38px; max-height: 100px;
  line-height: 1.45; outline: none; transition: border-color .15s; field-sizing: content;
}
.player-ta::placeholder { color: var(--text-3); }
.player-ta:focus { border-color: oklch(62% .13 52 / .5); }
.player-ta:disabled { opacity: .4; cursor: not-allowed; }
.btn-i {
  width: 36px; height: 36px; border-radius: var(--r); background: var(--surface-3);
  border: 1px solid var(--border); color: var(--text-3); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all .15s; font-size: 1rem;
}
.btn-i:hover { border-color: var(--copper-dim); color: var(--copper); }
.btn-i:disabled { opacity: .35; cursor: not-allowed; }
.btn-i.send { background: var(--copper-glow); border-color: oklch(62% .13 52 / .35); color: var(--copper); }
.btn-i.send:hover { background: var(--copper); color: var(--bg); }
.btn-i.mic-active { background: oklch(55% .14 22 / .2); border-color: oklch(55% .14 22 / .4); color: oklch(65% .14 22); animation: mic-ring 1.4s ease-in-out infinite; }
@keyframes mic-ring { 0%,100%{box-shadow:0 0 0 0 oklch(55% .14 22 / .3)} 50%{box-shadow:0 0 0 5px oklch(55% .14 22 / 0)} }
</style>
</head>
<body>

<!-- ── pre-session ───────────────────────────────────── -->
<div id="pre-session">
  <p class="pre-eyebrow">Virtual DM</p>
  <div id="campaign-picker" style="display:flex;gap:10px;margin-bottom:32px;flex-wrap:wrap;justify-content:center"></div>
  <h1 class="pre-campaign-name" id="pre-title">Loading…</h1>
  <p class="pre-scene" id="pre-scene"></p>
  <div class="pre-party-row" id="pre-party"></div>
  <button class="btn-begin" id="btn-begin" disabled>Begin Session</button>
</div>

<!-- ── game ─────────────────────────────────────────── -->
<div id="game" class="hidden">
  <header id="campaign-bar">
    <span class="cb-name" id="cb-name"></span>
    <span class="cb-scene" id="cb-scene"></span>
    <button id="tts-toggle" title="DM voice on/off" style="
      background:transparent;border:none;cursor:pointer;
      font-size:1.05rem;color:var(--text-3);padding:0 4px;
      transition:color .15s;line-height:1;
    " aria-pressed="false">🔇</button>
    <span class="cb-session">
      <span class="cb-dot"></span>
      Session <span id="cb-sess-num">1</span>
    </span>
  </header>

  <main id="narrative"></main>

  <!-- ── scene art panel ──────────────────────────────── -->
  <div id="scene-panel">
    <div id="scene-art-wrap">
      <img id="scene-art-img" style="display:none;opacity:0" alt="Current scene">
      <div id="scene-art-loading" style="display:none">
        <div class="art-spinner"></div>
        <span class="art-spinner-label">Painting scene…</span>
      </div>
      <div id="scene-art-placeholder">
        <span class="art-empty-icon">🎨</span>
        <span class="art-empty-label">Scene art appears when DM sets a location</span>
      </div>
    </div>

    <div id="map-section">
      <div id="map-art-wrap">
        <img id="map-img" style="display:none;opacity:0" alt="Area map">
        <div id="map-loading" style="display:none">
          <div class="art-spinner"></div>
          <span class="art-spinner-label">Drawing map…</span>
        </div>
        <div id="map-placeholder">
          <span class="art-empty-icon">🗺</span>
          <span class="art-empty-label">Map this area</span>
        </div>
      </div>
      <div id="map-controls">
        <input id="map-prompt-input" type="text" placeholder="Describe area to map… (e.g. warehouse ground floor)">
        <button id="map-gen-btn">Map it</button>
      </div>
    </div>

    <div id="scene-info-bar">
      <div class="scene-loc" id="art-loc-name">—</div>
      <div class="scene-date" id="art-date"></div>
    </div>
  </div>

  <aside id="party-status">
    <p class="s-label">Party</p>
    <div id="pc-list"></div>

    <div id="enc-section" style="display:none">
      <div class="s-div"></div>
      <p class="s-label">Encounter</p>
      <p class="enc-round">Round <strong id="enc-round">1</strong></p>
      <div id="c-list"></div>
    </div>

    <div id="location-section" style="display:none">
      <div class="s-div"></div>
      <p class="s-label">Location</p>
      <div class="loc-name" id="sb-loc-name"></div>
      <div class="loc-date" id="sb-loc-date"></div>
      <div id="sb-npc-list"></div>
    </div>

    <div id="quest-section" style="display:none">
      <div class="s-div"></div>
      <p class="s-label">Quests</p>
      <div id="q-list"></div>
    </div>

    <div id="clock-section" style="display:none">
      <div class="s-div"></div>
      <p class="s-label">Clocks</p>
      <div id="cl-list"></div>
    </div>

    <div id="inventory-section" style="display:none">
      <div class="s-div"></div>
      <p class="s-label">Carried</p>
      <div id="inv-list"></div>
    </div>
  </aside>

  <div id="player-strip">
    <div class="pia">
      <span class="pia-tag">Jeff</span>
      <div class="inp-row">
        <textarea class="player-ta" placeholder="Say or do something…" rows="1" id="ta-jeff"></textarea>
        <button class="btn-i" id="mic-jeff" title="Speak">🎤</button>
        <button class="btn-i send" id="send-jeff" title="Send (Enter)">↑</button>
      </div>
    </div>
    <div class="pia">
      <span class="pia-tag">Julee</span>
      <div class="inp-row">
        <textarea class="player-ta" placeholder="Say or do something…" rows="1" id="ta-julee"></textarea>
        <button class="btn-i" id="mic-julee" title="Speak">🎤</button>
        <button class="btn-i send" id="send-julee" title="Send (Enter)">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// CDN fallback stubs — safe degradation if scripts fail to load
if (typeof marked === 'undefined') { window.marked = { parse: s => s.replace(/\n/g, '<br>') }; }
// If DOMPurify didn't load, safeMarkdown falls back to HTML-escaped plain text only.
// The regex approach is NOT safe; don't attempt to replicate DOMPurify with regexes.
const _domPurifyLoaded = typeof DOMPurify !== 'undefined';

// ── safe helpers ──────────────────────────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#x27;');
}

function safeMarkdown(md) {
  if (!_domPurifyLoaded) {
    // DOMPurify unavailable: render as escaped plain text to avoid XSS
    const escaped = esc(md).replace(/\n/g, '<br>');
    return `<p>${escaped}</p>`;
  }
  return DOMPurify.sanitize(marked.parse(md), {
    ALLOWED_TAGS: ['p','strong','em','b','i','ul','ol','li','h1','h2','h3','br','code','pre','blockquote'],
    ALLOWED_ATTR: [],
  });
}

function setText(el, text) { el.textContent = String(text); }

// ── state ─────────────────────────────────────────────────────────────────────
let history = [];
let campaignId = null;
let campaignName = '';
let sessionId = null;
let streaming = false;
let initialState = null;
let ttsEnabled = false;

// ── elements ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const narrative = $('narrative');

// ── party rendering (DOM-based, no innerHTML with untrusted strings) ──────────

function hpColor(hp, maxHp) {
  const r = maxHp > 0 ? hp / maxHp : 0;
  if (hp === 0) return 'var(--hp-zero)';
  if (r > 0.5) return 'var(--hp-full)';
  if (r > 0.25) return 'var(--hp-mid)';
  if (r > 0) return 'var(--hp-crit)';
  return 'var(--hp-zero)';
}

function makePrePC(pc) {
  const ratio = pc.max_hp > 0 ? pc.hp / pc.max_hp : 0;
  const card = document.createElement('div');
  card.className = 'pre-pc';

  const name = document.createElement('div');
  name.className = 'pre-pc-name';
  setText(name, pc.name);

  const meta = document.createElement('div');
  meta.className = 'pre-pc-meta';
  setText(meta, `${pc.player_name} · ${pc.class_summary || 'Adventurer'}`);

  const track = document.createElement('div');
  track.className = 'pre-pc-track';
  const fill = document.createElement('div');
  fill.className = 'pre-pc-fill';
  fill.style.width = `${ratio * 100}%`;
  fill.style.background = hpColor(pc.hp, pc.max_hp);
  track.appendChild(fill);

  const nums = document.createElement('div');
  nums.className = 'pre-pc-nums';
  setText(nums, `${pc.hp} / ${pc.max_hp} HP`);

  card.append(name, meta, track, nums);
  return card;
}

function makeDeathSaves(ds) {
  const s = ds?.successes || 0, f = ds?.failures || 0;
  const row = document.createElement('div');
  row.className = 'ds-row';

  const lbl = document.createElement('span');
  lbl.className = 'ds-lbl';
  setText(lbl, 'Death saves');
  row.appendChild(lbl);

  const succPips = document.createElement('div');
  succPips.className = 'ds-pips';
  for (let i = 0; i < 3; i++) {
    const pip = document.createElement('span');
    pip.className = 'ds-pip' + (i < s ? ' s' : '');
    succPips.appendChild(pip);
  }
  row.appendChild(succPips);

  const sep = document.createElement('span');
  sep.className = 'ds-lbl';
  setText(sep, '·');
  sep.style.margin = '0 2px';
  row.appendChild(sep);

  const failPips = document.createElement('div');
  failPips.className = 'ds-pips';
  for (let i = 0; i < 3; i++) {
    const pip = document.createElement('span');
    pip.className = 'ds-pip' + (i < f ? ' f' : '');
    failPips.appendChild(pip);
  }
  row.appendChild(failPips);
  return row;
}

function makeSlots(slots) {
  if (!slots) return null;
  const entries = Object.entries(slots).filter(([,v]) => v.max > 0).sort(([a],[b]) => +a - +b);
  if (!entries.length) return null;
  const row = document.createElement('div');
  row.className = 'slots-row';
  for (const [lvl, v] of entries) {
    const g = document.createElement('div');
    g.className = 'slot-g';
    const l = document.createElement('div');
    l.className = 'slot-lvl';
    setText(l, lvl);
    const pips = document.createElement('div');
    pips.className = 'slot-pips';
    for (let i = 0; i < v.max; i++) {
      const p = document.createElement('span');
      p.className = 'slot-pip' + (i < v.used ? ' used' : '');
      pips.appendChild(p);
    }
    g.append(l, pips);
    row.appendChild(g);
  }
  return row;
}

function makePC(pc) {
  const card = document.createElement('div');
  card.className = 'pc-card';
  if (pc.hp === 0 && !pc.dead) card.classList.add('downed');

  const identity = document.createElement('div');
  identity.className = 'pc-identity';
  const namEl = document.createElement('span');
  namEl.className = 'pc-name-el';
  setText(namEl, pc.name);
  const clsEl = document.createElement('span');
  clsEl.className = 'pc-class-el';
  setText(clsEl, `${pc.class_summary || ''} · AC ${pc.ac || '?'}`);
  identity.append(namEl, clsEl);

  const hpOuter = document.createElement('div');
  hpOuter.className = 'hp-outer';
  const hpTrack = document.createElement('div');
  hpTrack.className = 'hp-track';
  const hpFill = document.createElement('div');
  hpFill.className = 'hp-fill';
  const ratio = pc.max_hp > 0 ? pc.hp / pc.max_hp : 0;
  hpFill.style.width = `${ratio * 100}%`;
  hpFill.style.background = hpColor(pc.hp, pc.max_hp);
  hpTrack.appendChild(hpFill);
  hpOuter.appendChild(hpTrack);

  const hpNums = document.createElement('div');
  hpNums.className = 'hp-nums';
  setText(hpNums, `${pc.hp} / ${pc.max_hp}${pc.temp_hp ? ` +${pc.temp_hp}` : ''}`);

  card.append(identity, hpOuter, hpNums);

  // conditions
  const conds = [...(pc.conditions || [])];
  if (pc.concentrating_on) conds.push(`Conc: ${pc.concentrating_on}`);
  if (conds.length) {
    const condList = document.createElement('div');
    condList.className = 'cond-list';
    for (const c of conds) {
      const pill = document.createElement('span');
      pill.className = 'cond-pill' + (c.startsWith('Conc:') ? ' cond-conc' : '');
      setText(pill, c);
      condList.appendChild(pill);
    }
    card.appendChild(condList);
  }

  // death saves
  if (pc.hp === 0 && !pc.dead && !pc.stable) {
    card.appendChild(makeDeathSaves(pc.death_saves));
  }

  // spell slots
  const slotsEl = makeSlots(pc.spell_slots);
  if (slotsEl) card.appendChild(slotsEl);

  return card;
}

function updatePartyStatus(state) {
  // Scene art + sidebar B
  updateScenePanel(state.scene);
  updateLocationSidebar(state.scene);
  updateInventorySidebar(state.party);

  // PCs
  const pcList = $('pc-list');
  pcList.replaceChildren(...(state.party || []).map(makePC));

  // Encounter
  const enc = state.encounter;
  const encSec = $('enc-section');
  if (enc) {
    encSec.style.display = '';
    setText($('enc-round'), enc.round);
    const cList = $('c-list');
    cList.replaceChildren(...(enc.combatants || []).map((c, i) => {
      const row = document.createElement('div');
      const active = i === enc.turn_index;
      row.className = 'c-row' + (active ? ' active' : '') + (c.status === 'dead' ? ' dead' : c.status === 'fled' ? ' fled' : '');
      const init = document.createElement('span');
      init.className = 'c-init';
      setText(init, c.initiative ?? '—');
      const nam = document.createElement('span');
      nam.className = 'c-name';
      setText(nam, c.name);
      const hp = document.createElement('span');
      hp.className = 'c-hp';
      setText(hp, `${c.hp}/${c.max_hp}`);
      row.append(init, nam, hp);
      return row;
    }));
  } else {
    encSec.style.display = 'none';
  }

  // Quests
  const quests = (state.quests || []).filter(q => q.status !== 'done' && q.status !== 'failed');
  const qSec = $('quest-section');
  if (quests.length) {
    qSec.style.display = '';
    $('q-list').replaceChildren(...quests.map(q => {
      const item = document.createElement('div');
      item.className = 'q-item';
      const t = document.createElement('div');
      t.className = 'q-title-el';
      setText(t, q.title);
      const s = document.createElement('span');
      s.className = 'q-status' + (q.status === 'active' ? ' active' : '');
      setText(s, q.status);
      item.append(t, s);
      return item;
    }));
  } else {
    qSec.style.display = 'none';
  }

  // Clocks
  const clocks = (state.clocks || []).filter(c => c.visible !== false);
  const clSec = $('clock-section');
  if (clocks.length) {
    clSec.style.display = '';
    $('cl-list').replaceChildren(...clocks.map(cl => {
      const item = document.createElement('div');
      item.className = 'cl-item';
      const n = document.createElement('div');
      n.className = 'cl-name-el';
      setText(n, cl.name);
      const track = document.createElement('div');
      track.className = 'cl-track';
      for (let i = 0; i < cl.segments; i++) {
        const seg = document.createElement('div');
        seg.className = 'cl-seg' + (i < cl.filled ? ' filled' : '');
        track.appendChild(seg);
      }
      item.append(n, track);
      return item;
    }));
  } else {
    clSec.style.display = 'none';
  }

  // campaign bar scene
  if (state.scene?.description) {
    setText($('cb-scene'), state.scene.description);
  }
}

// ── load pre-session ──────────────────────────────────────────────────────────
async function initPreSession() {
  // Safety: always enable button within 8s regardless of what happens
  const fallback = setTimeout(() => {
    $('btn-begin').disabled = false;
    if ($('pre-title').textContent === 'Loading…') setText($('pre-title'), 'Virtual DM');
  }, 8000);

  try {
    // Load campaign list
    const r = await Promise.race([
      fetch('/api/campaigns'),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 5000)),
    ]);
    const campaigns = await r.json();
    if (Array.isArray(campaigns) && campaigns.length) {
      const picker = $('campaign-picker');
      for (const c of campaigns) {
        const btn = document.createElement('button');
        btn.className = 'campaign-btn';
        setText(btn, c.name);
        btn.dataset.id = c.id;
        if (!campaignId) {
          campaignId = c.id;
          campaignName = c.name;
          btn.classList.add('selected');
        }
        btn.addEventListener('click', () => {
          campaignId = c.id;
          campaignName = c.name;
          picker.querySelectorAll('.campaign-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          loadCampaignDetails(c.id, c.name);
        });
        picker.appendChild(btn);
      }
    }
  } catch (e) {
    setText($('pre-title'), 'Virtual DM');
    setText($('pre-scene'), `Couldn't load campaigns: ${e.message}`);
  }

  if (campaignId) {
    await loadCampaignDetails(campaignId, campaignName);
  }

  clearTimeout(fallback);
  $('btn-begin').disabled = false;
}

async function loadCampaignDetails(cid, cname) {
  setText($('pre-title'), cname);
  setText($('pre-scene'), '');
  $('pre-party').replaceChildren();
  try {
    const r = await Promise.race([
      fetch(`/api/state?campaign_id=${cid}`),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 5000)),
    ]);
    initialState = await r.json();
    if (initialState.error) throw new Error(initialState.error);
    if (initialState.scene?.description) {
      setText($('pre-scene'), initialState.scene.description);
    } else {
      setText($('pre-scene'), 'Ready to begin.');
    }
    $('pre-party').replaceChildren(...(initialState.party || []).map(makePrePC));
  } catch (e) {
    setText($('pre-scene'), 'No party yet — import characters to begin.');
  }
}

// ── session start ─────────────────────────────────────────────────────────────
let priorSummary = ''; // cached for chat requests this session

async function beginSession() {
  $('btn-begin').disabled = true;
  $('btn-begin').textContent = 'Starting…';

  $('pre-session').classList.add('hidden');
  $('game').classList.remove('hidden');

  setText($('cb-name'), campaignName || 'Campaign');
  if (initialState) updatePartyStatus(initialState);

  // Load structured context: prior summaries (compressed) + current session messages only
  try {
    const r = await fetch(`/api/context?campaign_id=${campaignId}`);
    const ctx = await r.json();

    if (ctx.prior_summary) priorSummary = ctx.prior_summary;

    const currentMsgs = ctx.current_messages || [];

    if (currentMsgs.length > 0 || ctx.has_prior) {
      // Restore Claude history from current session messages only
      history = currentMsgs.map(m => ({ role: m.role, content: m.content }));

      // Render current session in narrative
      for (const m of currentMsgs) {
        if (m.role === 'user' && m.speaker) {
          appendPlayerBlock(m.speaker, m.content.replace(/^(Jeff|Julee):\s*/, ''));
        } else if (m.role === 'assistant') {
          const el = document.createElement('div');
          el.className = 'dm-block';
          el.innerHTML = safeMarkdown(m.content);
          narrative.appendChild(el);
        }
      }
      scrollN(true);

      // If last loaded message is from the DM, the session is mid-flight —
      // don't fire a new start_session prompt, just let players continue typing.
      const lastMsg = currentMsgs[currentMsgs.length - 1];
      if (lastMsg && lastMsg.role === 'assistant') {
        setInputsDisabled(false);
        return; // resume in place — no system trigger
      }

      // Divider before new session
      const div = document.createElement('div');
      div.style.cssText = 'height:1px;background:var(--border-sub);margin:20px 0 24px;max-width:64ch;opacity:0.5';
      narrative.appendChild(div);

      await sendToDM('system',
        'Call start_session, then call set_scene with a description of where the party currently is, then briefly ground us in the immediate moment without recapping the full story.');
      return;
    }
  } catch { /* fresh start */ }

  await sendToDM('system',
    'The session is beginning. Call start_session, then call set_scene with a vivid description of where the party is right now, then greet the players in character. End with what they see or sense that demands a response.');
}

// ── narrative helpers ─────────────────────────────────────────────────────────
let curDMEl = null;
let curDMText = '';

function appendPlayerBlock(speaker, text) {
  finishStream();
  const row = document.createElement('div');
  row.className = 'player-block';
  const lbl = document.createElement('span');
  lbl.className = 'player-label';
  setText(lbl, speaker);
  const msg = document.createElement('span');
  msg.className = 'player-text';
  setText(msg, text);
  row.append(lbl, msg);
  narrative.appendChild(row);
  scrollN();
}

function atBottom() {
  return narrative.scrollHeight - narrative.scrollTop - narrative.clientHeight < 120;
}

function scrollN(force = false) {
  if (force || atBottom()) {
    narrative.scrollTo({ top: narrative.scrollHeight, behavior: 'smooth' });
  }
}

function streamText(delta) {
  if (!curDMEl) {
    curDMEl = document.createElement('div');
    curDMEl.className = 'dm-block streaming';
    narrative.appendChild(curDMEl);
  }
  curDMText += delta;
  curDMEl.innerHTML = safeMarkdown(curDMText);
  curDMEl.classList.add('streaming');
  // no scroll during streaming — user controls position
}

function finishStream() {
  if (curDMEl) {
    curDMEl.innerHTML = safeMarkdown(curDMText);
    curDMEl.classList.remove('streaming');
    const text = curDMText;
    curDMEl = null;
    curDMText = '';
    scrollN(true); // scroll once after block is complete
    speakDM(text);
  }
  removeThinking();
}

function showThinking() {
  removeThinking();
  const el = document.createElement('div');
  el.className = 'thinking';
  el.id = 'thinking-el';
  const dots = document.createElement('div');
  dots.className = 'thinking-dots';
  dots.append(...[1,2,3].map(() => document.createElement('span')));
  el.appendChild(dots);
  narrative.appendChild(el);
  scrollN(true);
}

// ── scene art ─────────────────────────────────────────────────────────────────

function dispColor(d) {
  if (d >= 2) return 'var(--hp-full)';
  if (d >= 0) return 'oklch(68% .10 90)';
  if (d >= -1) return 'oklch(64% .10 42)';
  return 'var(--hp-crit)';
}

async function generateSceneImage(description, location) {
  if (!description && !location) return;
  const placeholder = $('scene-art-placeholder');
  const loading = $('scene-art-loading');
  const img = $('scene-art-img');

  placeholder.style.display = 'none';
  img.style.display = 'none';
  loading.style.display = 'flex';

  try {
    const r = await fetch('/api/scene-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description, location }),
    });
    const data = await r.json();
    if (data.url) {
      img.src = data.url;
      img.onload = () => {
        loading.style.display = 'none';
        img.style.display = 'block';
        // fade in
        requestAnimationFrame(() => { img.style.opacity = '1'; });
      };
      img.onerror = () => {
        loading.style.display = 'none';
        placeholder.style.display = 'flex';
      };
    } else {
      loading.style.display = 'none';
      placeholder.style.display = 'flex';
    }
  } catch {
    loading.style.display = 'none';
    placeholder.style.display = 'flex';
  }
}

function updateScenePanel(scene) {
  if (!scene) return;
  const locName = scene.location || scene.description?.split('.')[0] || '—';
  setText($('art-loc-name'), locName);
  setText($('art-date'), scene.in_game_date || '');
}

function updateLocationSidebar(scene) {
  if (!scene) return;
  const locSec = $('location-section');

  if (scene.location || scene.in_game_date) {
    locSec.style.display = '';
    setText($('sb-loc-name'), scene.location || '—');
    setText($('sb-loc-date'), scene.in_game_date || '');

    const npcList = $('sb-npc-list');
    const npcs = scene.npcs_present || [];
    if (npcs.length) {
      npcList.replaceChildren(...npcs.map(n => {
        const row = document.createElement('div');
        row.className = 'npc-row';
        const dot = document.createElement('div');
        dot.className = 'npc-disp';
        dot.style.background = dispColor(n.disposition);
        const info = document.createElement('div');
        const name = document.createElement('span');
        name.className = 'npc-name-s';
        setText(name, n.name);
        const role = document.createElement('span');
        role.className = 'npc-role-s';
        setText(role, n.role || '');
        info.append(name, document.createTextNode(' '), role);
        row.append(dot, info);
        return row;
      }));
    } else {
      npcList.replaceChildren();
    }
  } else {
    locSec.style.display = 'none';
  }
}

function updateInventorySidebar(party) {
  const invSec = $('inventory-section');
  const invList = $('inv-list');

  // Combine all inventory across party
  const allItems = [];
  for (const pc of (party || [])) {
    for (const item of (pc.inventory || [])) {
      if (item.item) allItems.push({ ...item, owner: pc.name });
    }
  }

  if (allItems.length) {
    invSec.style.display = '';
    invList.replaceChildren(...allItems.map(item => {
      const row = document.createElement('div');
      row.className = 'inv-item';
      const name = document.createElement('span');
      setText(name, item.item);
      const qty = document.createElement('span');
      qty.className = 'inv-qty';
      setText(qty, item.qty > 1 ? `×${item.qty}` : '');
      row.append(name, qty);
      return row;
    }));
  } else {
    invSec.style.display = 'none';
  }
}

// ── map generation ────────────────────────────────────────────────────────────

async function generateMap(description, location) {
  if (!description) return;
  const placeholder = $('map-placeholder');
  const loading = $('map-loading');
  const img = $('map-img');
  const btn = $('map-gen-btn');

  placeholder.style.display = 'none';
  img.style.display = 'none';
  img.style.opacity = '0';
  loading.style.display = 'flex';
  btn.disabled = true;

  try {
    const r = await fetch('/api/map-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description, location }),
    });
    const data = await r.json();
    if (data.url) {
      img.src = data.url;
      img.onload = () => {
        loading.style.display = 'none';
        img.style.display = 'block';
        requestAnimationFrame(() => { img.style.opacity = '1'; });
      };
      img.onerror = () => { loading.style.display = 'none'; placeholder.style.display = 'flex'; };
    } else {
      loading.style.display = 'none';
      placeholder.style.display = 'flex';
    }
  } catch {
    loading.style.display = 'none';
    placeholder.style.display = 'flex';
  } finally {
    btn.disabled = false;
  }
}

// ── TTS ───────────────────────────────────────────────────────────────────────
let _currentAudio = null;

function _stripMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/gs, '$1').replace(/\*(.+?)\*/gs, '$1')
    .replace(/#{1,6}\s*/g, '').replace(/`(.+?)`/g, '$1')
    .replace(/\[(.+?)\]\(.+?\)/g, '$1')
    .replace(/\n{2,}/g, '. ').replace(/\n/g, ' ').trim();
}

function _cancelSpeech() {
  if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
  window.speechSynthesis?.cancel();
}

async function speakDM(text) {
  if (!ttsEnabled) return;
  _cancelSpeech();
  const clean = _stripMarkdown(text);
  if (!clean) return;

  // Try OpenAI TTS first (server-side, onyx voice)
  try {
    const r = await fetch('/api/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: clean }),
    });
    if (r.ok && r.status !== 204) {
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      _currentAudio = audio;
      audio.onended = () => { URL.revokeObjectURL(url); _currentAudio = null; };
      audio.onerror = () => { URL.revokeObjectURL(url); _currentAudio = null; };
      await audio.play();
      return;
    }
  } catch { /* fall through to Web Speech */ }

  // Fallback: Web Speech API
  if (!window.speechSynthesis) return;
  const voices = window.speechSynthesis.getVoices();
  const prefs = ['Daniel', 'Google UK English Male', 'Alex'];
  const voice = prefs.map(p => voices.find(v => v.name.includes(p))).find(Boolean) || null;
  const utt = new SpeechSynthesisUtterance(clean);
  if (voice) utt.voice = voice;
  utt.rate = 0.88; utt.pitch = 0.88;
  window.speechSynthesis.speak(utt);
}

function removeThinking() {
  $('thinking-el')?.remove();
}

function appendToolEvent(name, result) {
  const el = document.createElement('div');
  el.className = 'tool-event';

  const icon = document.createElement('span');
  icon.className = 'te-icon';
  const label = document.createElement('span');
  const value = document.createElement('span');

  if (name === 'roll') {
    icon.textContent = '⬡';
    setText(label, 'Roll');
    value.className = 'te-roll';
    const nat = result.natural ? ` (${result.natural})` : '';
    setText(value, `${result.total}${nat}${result.outcome ? (result.outcome.success ? ' ✓' : ' ✗') : ''}`);
  } else if (name === 'death_save') {
    icon.textContent = result.dead ? '💀' : result.stable ? '🟢' : '🎲';
    setText(label, 'Death save');
    value.className = 'te-roll';
    setText(value, `${result.natural} — ${result.message || ''}`);
  } else if (name === 'update_character' && result.hp_after !== undefined) {
    icon.textContent = '♥';
    setText(label, 'HP');
    value.className = result.dropped ? 'te-hp-down' : 'te-hp-up';
    setText(value, String(result.hp_after));
  } else if (name === 'start_session') {
    if (result.session_id) sessionId = result.session_id;
    if (result.number) setText($('cb-sess-num'), result.number);
    return;
  } else {
    return; // don't surface all tool events
  }

  el.append(icon, label, value);
  narrative.appendChild(el);
  scrollN();
}

function scrollN() {
  narrative.scrollTo({ top: narrative.scrollHeight, behavior: 'smooth' });
}

// ── chat ──────────────────────────────────────────────────────────────────────
async function sendToDM(speaker, text) {
  if (streaming) return;
  streaming = true;
  setDisabled(true);

  const userMsg = speaker === 'system' ? text : `${speaker}: ${text}`;
  history.push({ role: 'user', content: userMsg });
  if (speaker !== 'system') appendPlayerBlock(speaker, text);
  showThinking();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, campaign_id: campaignId, session_id: sessionId, speaker, prior_summary: priorSummary }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let assistantText = '';

    removeThinking();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop() || '';

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(part.slice(6)); } catch { continue; }

        if (evt.type === 'text') {
          assistantText += evt.delta;
          streamText(evt.delta);
        } else if (evt.type === 'tool_result') {
          finishStream();
          appendToolEvent(evt.name, evt.result || {});
          // Generate map when DM calls generate_map tool
          if (evt.name === 'generate_map' && evt.result?.map_queued) {
            generateMap(evt.result.description || '', evt.result.location || '');
            if (evt.result.location) $('map-prompt-input').placeholder = `Map the ${evt.result.location}…`;
          }
          // Generate scene art when set_scene fires
          if (evt.name === 'set_scene' && evt.result) {
            const desc = evt.result.description || '';
            const loc = evt.result.location || '';
            generateSceneImage(desc, loc);
            updateScenePanel({ description: desc, location: loc });
            // Pre-fill map prompt with location name
            if (loc) {
              const mapInput = $('map-prompt-input');
              if (!mapInput.value) setText(mapInput, '');
              mapInput.placeholder = `Map the ${loc}…`;
            }
          }
          // Auto-generate summary when end_session fires (background, no await)
          if (evt.name === 'end_session' && sessionId && campaignId) {
            fetch('/api/generate-summary', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ campaign_id: campaignId, session_id: sessionId }),
            }).catch(() => {});
          }
        } else if (evt.type === 'map_request') {
          generateMap(evt.description || '', evt.location || '');
        } else if (evt.type === 'session_started') {
          sessionId = evt.session_id;
        } else if (evt.type === 'state_update') {
          updatePartyStatus(evt.state);
        } else if (evt.type === 'error') {
          finishStream();
          const errEl = document.createElement('div');
          errEl.className = 'tool-event';
          const errSpan = document.createElement('span');
          errSpan.style.color = 'var(--hp-crit)';
          setText(errSpan, `Error: ${evt.message}`);
          errEl.appendChild(errSpan);
          narrative.appendChild(errEl);
        } else if (evt.type === 'done') {
          finishStream();
        }
      }
    }

    if (assistantText) history.push({ role: 'assistant', content: assistantText });
    finishStream();

  } catch (e) {
    removeThinking();
    finishStream();
    const errEl = document.createElement('div');
    errEl.className = 'tool-event';
    const errSpan = document.createElement('span');
    errSpan.style.color = 'var(--hp-crit)';
    setText(errSpan, `Connection error: ${String(e)}`);
    errEl.appendChild(errSpan);
    narrative.appendChild(errEl);
  } finally {
    streaming = false;
    setDisabled(false);
    scrollN();
  }
}

function setDisabled(v) {
  ['ta-jeff','ta-julee','mic-jeff','mic-julee','send-jeff','send-julee'].forEach(id => {
    const el = $(id);
    if (el) el.disabled = v;
  });
}

// ── input wiring ──────────────────────────────────────────────────────────────
function wirePlayer(player, taId, micId, sendId) {
  const ta = $(taId), micBtn = $(micId), sendBtn = $(sendId);

  const submit = () => {
    const text = ta.value.trim();
    if (!text || streaming) return;
    ta.value = '';
    _cancelSpeech();
    sendToDM(player, text);
  };

  sendBtn.addEventListener('click', submit);
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const rec = new SR();
    rec.continuous = false; rec.interimResults = false; rec.lang = 'en-US';
    let active = false;

    micBtn.addEventListener('click', () => {
      if (active) { rec.stop(); return; }
      try { rec.start(); active = true; micBtn.classList.add('mic-active'); micBtn.textContent = '⏹'; }
      catch (e) { console.warn('STT error', e); }
    });
    rec.addEventListener('result', e => { ta.value = e.results[0][0].transcript; });
    rec.addEventListener('end', () => { active = false; micBtn.classList.remove('mic-active'); micBtn.textContent = '🎤'; });
    rec.addEventListener('error', () => { active = false; micBtn.classList.remove('mic-active'); micBtn.textContent = '🎤'; });
  } else {
    micBtn.title = 'Voice not supported — use Chrome or Edge';
    micBtn.style.opacity = '0.3';
  }
}

wirePlayer('Jeff',  'ta-jeff',  'mic-jeff',  'send-jeff');
wirePlayer('Julee', 'ta-julee', 'mic-julee', 'send-julee');

$('btn-begin').addEventListener('click', beginSession);

// Map generator
$('map-gen-btn').addEventListener('click', () => {
  const desc = $('map-prompt-input').value.trim();
  if (!desc) return;
  const loc = $('art-loc-name').textContent !== '—' ? $('art-loc-name').textContent : '';
  generateMap(desc, loc);
});
$('map-prompt-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('map-gen-btn').click();
});

// TTS toggle
$('tts-toggle').addEventListener('click', () => {
  ttsEnabled = !ttsEnabled;
  const btn = $('tts-toggle');
  btn.textContent = ttsEnabled ? '🔊' : '🔇';
  btn.style.color = ttsEnabled ? 'var(--copper)' : 'var(--text-3)';
  btn.setAttribute('aria-pressed', String(ttsEnabled));
  if (!ttsEnabled) _cancelSpeech();
});

initPreSession();
</script>
